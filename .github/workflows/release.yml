name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # OIDC for trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # NO registry-url here — it poisons .npmrc for OIDC
      - run: npm install -g npm@latest   # guarantee >= 11.5.1
      # ... your version-check / npm ci / typecheck / test / build steps ...
      - run: npm publish --provenance --access public
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish   # tokenless; provenance/access from publishConfig
