name: Monthly data update

on:
  schedule:
    # Japan Post refreshes KEN_ALL near the end of each month;
    # run on the 1st, 03:00 JST (18:00 UTC prev day)
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the Release workflow

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild postal data from Japan Post
        run: |
          npm ci
          npm run build:data

      - name: Detect changes
        id: diff
        run: |
          # Stage so brand-new chunk files (untracked) are detected too
          git add -A data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data, bump patch version, push tag
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          git config user.name "nihonpost-bot"
          git config user.email "actions@github.com"
          # Commit the data first: npm version refuses to run on a dirty tree
          git commit -m "data: monthly Japan Post refresh"
          npm version patch -m "chore: release %s"
          git push --follow-tags
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tag pushes made with GITHUB_TOKEN don't trigger other workflows
      # (recursion guard), so dispatch the Release workflow explicitly.
      # All npm publishing lives in release.yml — the single workflow
      # registered as the package's trusted publisher.
      - name: Trigger release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
